<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programme — Théo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;
    --bg-elevated:#111113;
    --bg-card:#131316;
    --text:#ededea;
    --muted:#77797f;
    --border:rgba(237,237,234,0.10);
    --border-strong:rgba(237,237,234,0.22);
    --glow:#f5f5f0;
    --glow-soft:rgba(245,245,240,0.35);
    --glow-dim:rgba(245,245,240,0.08);
    --ok:#e7e7e2;
    --radius:14px;
    font-family:'Inter',sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  :root[data-theme="light"]{ --bg:#0a0a0b; --text:#ededea; }

  h1,h2,h3{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.005em;
    margin:0;
  }

  #app{
    max-width:560px;
    margin:0 auto;
    padding:0 16px 100px;
    min-height:100%;
  }

  header.topbar{
    position:sticky;
    top:0;
    padding-top:calc(env(safe-area-inset-top,0px) + 20px);
    padding-bottom:16px;
    background:linear-gradient(var(--bg) 75%, transparent);
    z-index:5;
  }
  header.topbar .eyebrow{
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.03em;
    margin-bottom:4px;
  }
  header.topbar h1{
    font-size:27px;
    line-height:1.15;
    color:var(--glow);
    text-shadow:0 0 18px var(--glow-soft), 0 0 2px var(--glow-dim);
  }
  header.topbar .meta{
    color:var(--muted);
    font-size:13px;
    margin-top:7px;
  }

  .day-grid{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .day-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:15px 16px;
    text-decoration:none;
    color:inherit;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .day-card:active{ transform:scale(0.98); }
  .day-card:hover{ border-color:var(--border-strong); box-shadow:0 0 22px rgba(245,245,240,0.06); }
  .day-icon{
    flex:0 0 auto;
    width:42px;height:42px;
    border-radius:11px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
  }
  .day-icon svg{ width:22px;height:22px; stroke:var(--glow); filter:drop-shadow(0 0 4px var(--glow-dim)); }
  .day-card .info{ flex:1; min-width:0; }
  .day-card .day-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.03em;
    margin-bottom:2px;
  }
  .day-card .day-name{ font-family:'Oswald',sans-serif; font-weight:500; font-size:17px; }
  .day-card .chev{ color:var(--muted); flex:0 0 auto; }

  .home-note{
    margin-top:24px;
    padding:15px 16px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--muted);
    font-size:13.5px;
    line-height:1.55;
  }

  .exlist{ display:flex; flex-direction:column; gap:12px; margin-top:8px; }
  .excard{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:15px 16px 13px;
  }
  .excard .exname{ font-family:'Oswald',sans-serif; font-weight:500; font-size:16px; margin-bottom:3px; }
  .excard .exnotes{ color:var(--muted); font-size:13px; line-height:1.5; margin:4px 0 12px; }
  .exrow{ display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .field.reps-ref{ padding:0 2px; }
  .field.reps-ref .static{ font-family:'IBM Plex Mono',monospace; font-size:14px; padding:9px 0 8px; color:var(--text); }
  .field input{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    color:var(--text);
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:9px;
    padding:8px 10px;
    width:60px;
  }
  .field.poids input{ width:92px; }
  .field input:focus{ outline:none; border-color:var(--border-strong); box-shadow:0 0 0 3px var(--glow-dim); }
  .save-btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    background:var(--glow);
    color:#0a0a0b;
    border:none;
    border-radius:9px;
    padding:9px 15px;
    cursor:pointer;
    margin-left:auto;
    box-shadow:0 0 16px var(--glow-dim);
    transition:box-shadow .15s ease, transform .1s ease;
  }
  .save-btn:active{ transform:scale(0.96); }
  .save-btn.saved{ background:var(--ok); box-shadow:0 0 20px rgba(245,245,240,0.3); }

  .prog-toggle{
    margin-top:11px;
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
  }
  .prog-toggle svg{ width:13px;height:13px; transition:transform .15s ease; }
  .prog-toggle.open svg{ transform:rotate(90deg); }
  .prog-toggle.open{ color:var(--text); }
  .prog-panel{ display:none; margin-top:9px; padding-top:11px; border-top:1px solid var(--border); }
  .prog-panel.open{ display:block; }
  .prog-panel .empty{ color:var(--muted); font-size:12.5px; }
  .prog-panel svg{ width:100%; height:60px; display:block; }
  .prog-hist{ margin-top:9px; display:flex; flex-direction:column; gap:3px; max-height:110px; overflow-y:auto; }
  .prog-hist .hrow{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; color:var(--muted); padding:2px 0;
  }
  .prog-hist .hrow span:last-child{ color:var(--text); }

  .progress-day-heading{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--muted);
    text-transform:uppercase;
    margin:22px 2px 8px;
  }
  .progress-day-heading:first-child{ margin-top:4px; }
  .progress-list{ display:flex; flex-direction:column; gap:10px; }
  .progress-card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:13px 14px 10px;
  }
  .progress-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
  }
  .progress-head .pname{ font-family:'Oswald',sans-serif; font-weight:500; font-size:15px; }
  .pdelta{
    display:flex;
    align-items:center;
    gap:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--glow);
    flex:0 0 auto;
  }
  .pdelta svg{ stroke:var(--glow); }
  .pdelta.neg{ color:var(--muted); }
  .pdelta.neg svg{ stroke:var(--muted); }

  nav.bottomnav{
    position:fixed;
    left:0;right:0;bottom:0;
    padding-bottom:env(safe-area-inset-bottom,0px);
    background:var(--bg-elevated);
    border-top:1px solid var(--border);
    display:flex;
    justify-content:center;
    z-index:10;
  }
  nav.bottomnav .inner{ width:100%; max-width:560px; display:flex; }
  nav.bottomnav a{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:10px 2px 9px;
    color:var(--muted);
    text-decoration:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.02em;
    cursor:pointer;
  }
  nav.bottomnav a svg{ width:19px;height:19px; stroke:var(--muted); }
  nav.bottomnav a.active{ color:var(--glow); }
  nav.bottomnav a.active svg{ stroke:var(--glow); filter:drop-shadow(0 0 5px var(--glow-dim)); }

  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="bottomnav"><div class="inner" id="bottomnav"></div></nav>

<script>

const STORE_KEY = 'theo-prog-v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveState(state){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Sauvegarde impossible', e); }
}
let STATE = loadState();

function exId(dayId, idx){ return dayId+'-ex'+idx; }
function getEx(dayId, idx, def){
  const id = exId(dayId, idx);
  if(!STATE[id]){
    STATE[id] = { series: def.sets, poids: def.charge, history: [] };
  }
  return STATE[id];
}
function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'2-digit' });
}

function parseNum(v){
  if(!v) return null;
  const m = String(v).replace(',', '.').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function sparkline(history){
  const pts = history.map(h => parseNum(h.poids)).filter(v => v !== null);
  if(pts.length < 2) return null;
  const w = 280, h = 56, pad = 6;
  const min = Math.min(...pts), max = Math.max(...pts);
  const range = (max - min) || 1;
  const stepX = (w - pad*2) / (pts.length - 1);
  const coords = pts.map((v,i) => {
    const x = pad + i*stepX;
    const y = h - pad - ((v-min)/range)*(h-pad*2);
    return [x,y];
  });
  const path = coords.map((c,i) => (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.4" fill="var(--glow)"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="filter:drop-shadow(0 0 4px var(--glow-dim))"><path d="${path}" fill="none" stroke="var(--glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

const app = document.getElementById('app');

function renderBottomNav(activeId){
  const items = [{id:'home', icon:'home', label:'Accueil'}, {id:'progress', icon:'chart', label:'Stats'}]
    .concat(DAYS.map((d,i) => ({id:d.id, icon:d.icon, label:'J'+(i+1)})));
  document.getElementById('bottomnav').innerHTML = items.map(it => `
    <a class="${activeId===it.id?'active':''}" onclick="navigate('${it.id==='home'?'':'#/'+it.id}')">
      ${ICONS[it.icon]}
      <span>${it.label}</span>
    </a>
  `).join('');
}

function renderHome(){
  renderBottomNav('home');
  app.innerHTML = `
    <header class="topbar">
      <div class="eyebrow">// programme d'entraînement</div>
      <h1>Salut Théo</h1>
      <div class="meta">5 séances — modifie tes séries et tes charges au fil des semaines</div>
    </header>
    <div class="day-grid">
      ${DAYS.map(d => `
        <a class="day-card" onclick="navigate('#/${d.id}')">
          <div class="day-icon">${ICONS[d.icon]}</div>
          <div class="info">
            <div class="day-label">${d.label}</div>
            <div class="day-name">${d.name}</div>
          </div>
          <div class="chev">${ICONS.chev}</div>
        </a>
      `).join('')}
    </div>
    <div class="home-note">Tes séries, tes charges et ton historique de progression sont enregistrés directement sur ce téléphone. Ajoute cette page à ton écran d'accueil pour y accéder comme une appli.</div>
  `;
}

function bigChart(history){
  const pts = history.map(h => parseNum(h.poids)).filter(v => v !== null);
  const dates = history.filter(h => parseNum(h.poids) !== null).map(h => h.date);
  if(pts.length < 2) return null;
  const w = 300, h = 90, padL = 28, padR = 6, padT = 10, padB = 18;
  const min = Math.min(...pts), max = Math.max(...pts);
  const range = (max - min) || 1;
  const stepX = (w - padL - padR) / (pts.length - 1);
  const coords = pts.map((v,i) => {
    const x = padL + i*stepX;
    const y = h - padB - ((v-min)/range)*(h-padT-padB);
    return [x,y];
  });
  const path = coords.map((c,i) => (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.6" fill="var(--glow)"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="filter:drop-shadow(0 0 4px var(--glow-dim))">
    <text x="${padL-4}" y="${padT+4}" text-anchor="end" font-family="IBM Plex Mono" font-size="9" fill="var(--muted)">${max}</text>
    <text x="${padL-4}" y="${h-padB+2}" text-anchor="end" font-family="IBM Plex Mono" font-size="9" fill="var(--muted)">${min}</text>
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="var(--border)" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="var(--glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${padL}" y="${h-2}" font-family="IBM Plex Mono" font-size="9" fill="var(--muted)">${dates[0]}</text>
    <text x="${w-padR}" y="${h-2}" text-anchor="end" font-family="IBM Plex Mono" font-size="9" fill="var(--muted)">${dates[dates.length-1]}</text>
  </svg>`;
}

function renderProgress(){
  renderBottomNav('progress');
  app.innerHTML = `
    <header class="topbar">
      <div class="eyebrow">// vue d'ensemble</div>
      <h1>Progression</h1>
      <div class="meta">Évolution des charges, exercice par exercice</div>
    </header>
    <div id="progress-body"></div>
  `;
  const body = document.getElementById('progress-body');
  let html = '';
  let any = false;

  DAYS.forEach(day => {
    const rows = day.exercises.map((ex, i) => {
      const state = getEx(day.id, i, ex);
      if(state.history.length < 2) return null;
      const pts = state.history.map(h => parseNum(h.poids)).filter(v => v !== null);
      if(pts.length < 2) return null;
      any = true;
      const first = pts[0], last = pts[pts.length-1];
      const delta = last - first;
      const deltaStr = (delta > 0 ? '+' : '') + (Number.isInteger(delta) ? delta : delta.toFixed(1));
      const arrow = delta >= 0 ? ICONS.up : ICONS.down;
      const chart = bigChart(state.history);
      return `
        <div class="progress-card">
          <div class="progress-head">
            <div class="pname">${ex.n}</div>
            <div class="pdelta ${delta >= 0 ? 'pos' : 'neg'}">${arrow}<span>${deltaStr}</span></div>
          </div>
          ${chart || ''}
        </div>`;
    }).filter(Boolean);

    if(rows.length){
      html += `<div class="progress-day-heading">${day.label} — ${day.name}</div><div class="progress-list">${rows.join('')}</div>`;
    }
  });

  if(!any){
    html = `<div class="home-note">Pas encore assez de données. Enregistre au moins deux poids différents sur un même exercice (depuis ses pages de séance) pour voir sa courbe apparaître ici.</div>`;
  }
  body.innerHTML = html;
}

function renderDay(dayId){
  const day = DAYS.find(d => d.id === dayId);
  if(!day){ renderHome(); return; }
  renderBottomNav(dayId);
  app.innerHTML = `
    <header class="topbar">
      <div class="eyebrow">// ${day.label}</div>
      <h1>${day.name}</h1>
      <div class="meta">${day.exercises.length} exercices</div>
    </header>
    <div class="exlist" id="exlist"></div>
  `;
  const list = document.getElementById('exlist');
  list.innerHTML = day.exercises.map((ex, i) => {
    const state = getEx(day.id, i, ex);
    return `
    <div class="excard" data-day="${day.id}" data-idx="${i}">
      <div class="exname">${ex.n}</div>
      <div class="exnotes">${ex.notes}</div>
      <div class="exrow">
        <div class="field">
          <label>Séries</label>
          <input type="number" min="1" class="inp-series" value="${state.series}">
        </div>
        <div class="field reps-ref">
          <label>Reps</label>
          <div class="static">${ex.reps}</div>
        </div>
        <div class="field poids">
          <label>Poids</label>
          <input type="text" class="inp-poids" value="${state.poids}">
        </div>
        <button class="save-btn">Enregistrer</button>
      </div>
      <div class="prog-toggle"><span>${ICONS.chev}</span> progression (${state.history.length})</div>
      <div class="prog-panel"></div>
    </div>`;
  }).join('');

  list.querySelectorAll('.excard').forEach(card => {
    const idx = parseInt(card.dataset.idx, 10);
    const dId = card.dataset.day;
    const def = day.exercises[idx];

    card.querySelector('.save-btn').addEventListener('click', () => {
      const series = card.querySelector('.inp-series').value;
      const poids = card.querySelector('.inp-poids').value;
      const state = getEx(dId, idx, def);
      state.series = series;
      const changed = state.poids !== poids;
      state.poids = poids;
      if(changed && poids.trim() !== ''){
        state.history.push({ date: todayStr(), poids: poids });
        if(state.history.length > 60) state.history.shift();
      }
      saveState(STATE);
      const btn = card.querySelector('.save-btn');
      btn.textContent = 'Enregistré';
      btn.classList.add('saved');
      setTimeout(() => { btn.textContent = 'Enregistrer'; btn.classList.remove('saved'); }, 1400);
      const toggle = card.querySelector('.prog-toggle');
      toggle.innerHTML = `<span>${ICONS.chev}</span> progression (${state.history.length})`;
      if(toggle.classList.contains('open')){
        toggle.classList.add('open');
        renderPanel(card, dId, idx, def, true);
      }
    });

    card.querySelector('.prog-toggle').addEventListener('click', () => {
      const toggle = card.querySelector('.prog-toggle');
      const open = toggle.classList.toggle('open');
      renderPanel(card, dId, idx, def, open);
    });
  });
}

function renderPanel(card, dId, idx, def, forceOpen){
  const panel = card.querySelector('.prog-panel');
  const toggle = card.querySelector('.prog-toggle');
  const isOpen = forceOpen !== undefined ? forceOpen : panel.classList.contains('open');
  if(isOpen){ panel.classList.add('open'); toggle.classList.add('open'); }
  else { panel.classList.remove('open'); toggle.classList.remove('open'); return; }

  const state = getEx(dId, idx, def);
  const spark = sparkline(state.history);
  const rows = state.history.slice().reverse().map(h => `<div class="hrow"><span>${h.date}</span><span>${h.poids}</span></div>`).join('');
  panel.innerHTML = `
    ${spark ? spark : `<div class="empty">Enregistre au moins 2 poids différents pour voir la courbe.</div>`}
    <div class="prog-hist">${rows || `<div class="empty">Pas encore d'historique.</div>`}</div>
  `;
}

function navigate(hash){
  window.location.hash = hash;
}
function route(){
  const h = window.location.hash.replace('#/', '');
  if(!h){ renderHome(); return; }
  if(h === 'progress'){ renderProgress(); return; }
  renderDay(h);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
